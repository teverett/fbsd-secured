- name: disable portmap
  ansible.builtin.lineinfile:
    path: /etc/rc.conf
    line: portmap_enable="NO"
    regexp: ^portmap_enable

#- name: disable syslog logging to network
#  ansible.builtin.lineinfile:
#    path: /etc/rc.conf
#    line: syslogd_flags="-s"
#    regexp: ^syslogd_flags

- name: disable dumpdev
  ansible.builtin.lineinfile:
    path: /etc/rc.conf
    line: dumpdev="NO"
    regexp: ^dumpdev

- name: don't update MOTD on boot
  ansible.builtin.lineinfile:
    path: /etc/rc.conf
    line: update_motd="NO"
    regexp: ^update_motd

- name: enable background fsck
  ansible.builtin.lineinfile:
    path: /etc/rc.conf
    line: background_fsck="YES"
    regexp: ^background_fsck

- name: -y on background fsck
  ansible.builtin.lineinfile:
    path: /etc/rc.conf
    line: fsck_y_enable="YES"
    regexp: ^fsck_y_enable

- name: -f on background fsck
  ansible.builtin.lineinfile:
    path: /etc/rc.conf
    line: fsck_y_flags="-f"
    regexp: ^fsck_y_flags
