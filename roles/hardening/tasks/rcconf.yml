- name: clean tmp on boot
  ansible.builtin.lineinfile:
    path: /etc/rc.conf
    line: clear_tmp_enable="YES"
    regexp: ^clear_tmp_enable

- name: disable sendmail
  ansible.builtin.lineinfile:
    path: /etc/rc.conf
    line: sendmail_enable="NONE"
    regexp: ^sendmail_enable

- name: sendmail in queue mode
  ansible.builtin.lineinfile:
    path: /etc/rc.conf
    line: sendmail_flags="-q1m"
    regexp: ^sendmail_flags

- name: disable inetd
  ansible.builtin.lineinfile:
    path: /etc/rc.conf
    line: inetd_enable="NO"
    regexp: ^inetd_enable

