
# https://docs.freebsd.org/en/books/handbook/security/
- name: blackhole tcp
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    line: net.inet.tcp.blackhole=2
    regexp: net.inet.tcp.blackhole

# https://docs.freebsd.org/en/books/handbook/security/  
- name: blackhole udp
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    line: net.inet.udp.blackhole=1
    regexp: net.inet.udp.blackhole

# https://docs.freebsd.org/en/books/handbook/security/  
- name: disable icmp redirect
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    line: net.inet.icmp.drop_redirect=1
    regexp: net.inet.icmp.drop_redirect

# https://docs.freebsd.org/en/books/handbook/security/  
- name: disable ip redirect
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    line: net.inet.ip.redirect=0
    regexp: net.inet.ip.redirect

# https://docs.freebsd.org/en/books/handbook/security/  
- name: disable source routing (1)
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    line: net.inet.ip.sourceroute=0
    regexp: net.inet.ip.sourceroute

# https://docs.freebsd.org/en/books/handbook/security/  
- name: disable source routing (2)
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    line: net.inet.ip.accept_sourceroute=0
    regexp: net.inet.ip.accept_sourceroute

# https://docs.freebsd.org/en/books/handbook/security/  
- name: don't echo broadcasts
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    line: net.inet.icmp.bmcastecho=0
    regexp: net.inet.icmp.bmcastecho

# https://forums.freebsd.org/threads/system-hardening-options-post-install.75476/ 
- name: disable users from seeing jail processes
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    line: security.bsd.see_jail_proc=0
    regexp: security.bsd.see_jail_proc

# https://docs.freebsd.org/en/books/handbook/security/  
- name: disable users from seeing other's processes
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    line: security.bsd.see_other_uids=0
    regexp: security.bsd.see_other_uids

# https://docs.freebsd.org/en/books/handbook/security/  
- name: disable users from seeing other group's processes
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    line: security.bsd.see_other_gids=0
    regexp: security.bsd.see_other_gids

# https://bsdadventures.com/harden-freebsd/
- name: security.bsd.unprivileged_read_msgbuf=0
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    line: security.bsd.unprivileged_read_msgbuf=0
    regexp: security.bsd.unprivileged_read_msgbuf

# https://bsdadventures.com/harden-freebsd/
- name: security.bsd.unprivileged_proc_debug=0
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    line: security.bsd.unprivileged_proc_debug=0
    regexp: security.bsd.unprivileged_proc_debug

# https://bsdadventures.com/harden-freebsd/
- name: security.bsd.stack_guard_page=1
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    line: security.bsd.stack_guard_page=1
    regexp: security.bsd.stack_guard_page

# https://yorickpeterse.com/articles/a-brief-look-at-freebsd/
- name: kern.randompid=1
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    line: kern.randompid=1
    regexp: kern.randompid

# https://man.freebsd.org/cgi/man.cgi?query=security -- drops TCP packets with both SYN and FIN
# set, a combination real connections never use but OS-fingerprinting/firewall-evasion scans do.
- name: net.inet.tcp.drop_synfin=1
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    line: net.inet.tcp.drop_synfin=1
    regexp: net.inet.tcp.drop_synfin

# https://man.freebsd.org/cgi/man.cgi?query=ip -- randomizes the IP ID field instead of using a
# predictable counter, hindering traffic analysis/OS fingerprinting.
- name: net.inet.ip.random_id=1
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    line: net.inet.ip.random_id=1
    regexp: net.inet.ip.random_id

# https://man.freebsd.org/cgi/man.cgi?query=security -- stop users from hardlinking to files
# they don't own, closing a privilege-escalation/race vector; pairs with see_other_uids/gids.
- name: security.bsd.hardlink_check_uid=1
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    line: security.bsd.hardlink_check_uid=1
    regexp: security.bsd.hardlink_check_uid

- name: security.bsd.hardlink_check_gid=1
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    line: security.bsd.hardlink_check_gid=1
    regexp: security.bsd.hardlink_check_gid

# https://man.freebsd.org/cgi/man.cgi?query=security -- don't dump core for setuid/setgid
# processes, avoiding sensitive memory being written to disk; pairs with dumpdev=NO in rc.conf.
- name: kern.sugid_coredump=0
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    line: kern.sugid_coredump=0
    regexp: kern.sugid_coredump

# https://man.freebsd.org/cgi/man.cgi?query=mount -- only root may mount/unmount filesystems
# (e.g. removable media), rather than any user via vfs.usermount.
- name: vfs.usermount=0
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    line: vfs.usermount=0
    regexp: vfs.usermount

# https://man.freebsd.org/cgi/man.cgi?query=security
- name: kern.ipc.shm_allow_removed=0
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    line: kern.ipc.shm_allow_removed=0
    regexp: kern.ipc.shm_allow_removed
